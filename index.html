<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Totalizador de venta</title>
  </head>
  <body>
    <h1>Totalizador de venta</h1>
    <form id="venta-form">
      <label for="cantidad">Cantidad:</label>
      <input type="number" id="cantidad" />
      <label for="precio-unitario">Precio por unidad:</label>
      <input type="number" id="precio-unitario" />
      <label for="peso-volumetrico">Peso volumétrico por unidad:</label>
      <input type="number" id="peso-volumetrico" step="any" />
      <label for="estado">Estado:</label>
      <select id="estado">
        <option value="CA">California</option>
        <option value="UT">Utah</option>
        <option value="NV">Nevada</option>
        <option value="TX">Texas</option>
        <option value="AL">Alabama</option>
      </select>
      <label for="categoria">Categoría:</label>
      <select id="categoria">
        <option value="Varios">Varios</option>
        <option value="Alimentos">Alimentos</option>
        <option value="Bebidas alcohólicas">Bebidas alcohólicas</option>
        <option value="Material de escritorio">Material de escritorio</option>
        <option value="Muebles">Muebles</option>
        <option value="Electrónicos">Electrónicos</option>
        <option value="Vestimenta">Vestimenta</option>
      </select>
      <label for="tipo-cliente">Tipo de cliente:</label>
      <select id="tipo-cliente">
        <option value="Normal">Normal</option>
        <option value="Recurrente">Recurrente</option>
        <option value="Antiguo Recurrente">Antiguo Recurrente</option>
        <option value="Especial">Especial</option>
      </select>
      <button type="submit" id="calcular-button">Calcular</button>
      <button type="button" id="confirmar-button">Confirmar compra</button>
      <button type="button" id="cancelar-button">Cancelar</button>
    </form>
    <div id="resultado-div"></div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
